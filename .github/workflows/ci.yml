name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Rate Limiting & Policy Tests
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run Algorithm & Policy Tests
      run: |
        python3 -m unittest discover -s tests -v

    - name: Run Algorithmic Simulation Demo
      run: |
        python3 scripts/demo.py
